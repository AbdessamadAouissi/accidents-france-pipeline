name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system deps (geo)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev gdal-bin

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests dashboard

      - name: Format check (black)
        run: black --check src tests dashboard

      - name: Type check (mypy)
        run: mypy src --ignore-missing-imports || true

      - name: Tests + coverage
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install dbt-core==1.8.1 dbt-duckdb==1.8.1
      - name: dbt deps + compile
        working-directory: dbt_project
        run: |
          mkdir -p ../data/warehouse
          dbt deps --profiles-dir .
          dbt compile --profiles-dir .

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t accidents-api:ci .
      - name: Build Dashboard image
        run: docker build -f docker/Dockerfile.streamlit -t accidents-dashboard:ci .
