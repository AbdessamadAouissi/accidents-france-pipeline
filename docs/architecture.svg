<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/>
    </marker>
    <style>
      .col-title { font-size: 13px; font-weight: 700; fill: #6B7280; text-transform: uppercase; letter-spacing: 0.5px; }
      .box-title { font-size: 14px; font-weight: 600; }
      .box-sub { font-size: 11px; fill: #6B7280; }
      .arrow { stroke: #9CA3AF; stroke-width: 1.5; fill: none; }
      .arrow-main { stroke: #1F2937; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Architecture du pipeline — Accidents de la route en France</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6B7280">De l'extraction des données ouvertes au dashboard interactif · 221 044 accidents · 7 modèles dbt · 2 modèles ML</text>

  <!-- ============== Column 1 : SOURCES ============== -->
  <text x="120" y="110" text-anchor="middle" class="col-title">Sources</text>
  <g>
    <rect x="40" y="125" width="160" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="148" text-anchor="middle" class="box-title" fill="#92400E">ONISR (BAAC)</text>
    <text x="120" y="167" text-anchor="middle" class="box-sub">data.gouv.fr API</text>

    <rect x="40" y="205" width="160" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="228" text-anchor="middle" class="box-title" fill="#92400E">Open-Meteo</text>
    <text x="120" y="247" text-anchor="middle" class="box-sub">climat 20 deps × 4 ans</text>

    <rect x="40" y="285" width="160" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="308" text-anchor="middle" class="box-title" fill="#92400E">INSEE</text>
    <text x="120" y="327" text-anchor="middle" class="box-sub">population communale</text>
  </g>

  <!-- arrows from sources to extract -->
  <path d="M 200 155 C 230 155, 240 235, 270 235" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 200 235 L 270 235" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 200 315 C 230 315, 240 235, 270 235" class="arrow" marker-end="url(#arrow)"/>

  <!-- ============== Column 2 : EXTRACT ============== -->
  <text x="350" y="110" text-anchor="middle" class="col-title">Extract</text>
  <rect x="270" y="205" width="160" height="60" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="350" y="228" text-anchor="middle" class="box-title" fill="#1E40AF">Python + requests</text>
  <text x="350" y="247" text-anchor="middle" class="box-sub">parse URLs stables</text>

  <path d="M 430 235 L 500 235" class="arrow" marker-end="url(#arrow)"/>

  <!-- ============== Column 3 : TRANSFORM ============== -->
  <text x="580" y="110" text-anchor="middle" class="col-title">Transform</text>
  <rect x="500" y="205" width="160" height="60" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="580" y="228" text-anchor="middle" class="box-title" fill="#1E40AF">pandas</text>
  <text x="580" y="247" text-anchor="middle" class="box-sub">cleaning + dérivés</text>

  <path d="M 660 235 L 730 235" class="arrow" marker-end="url(#arrow)"/>

  <!-- ============== Column 4 : WAREHOUSE ============== -->
  <text x="810" y="110" text-anchor="middle" class="col-title">Warehouse</text>
  <rect x="730" y="205" width="160" height="60" rx="8" fill="#FEF9C3" stroke="#EAB308" stroke-width="1"/>
  <text x="810" y="228" text-anchor="middle" class="box-title" fill="#854D0E">DuckDB</text>
  <text x="810" y="247" text-anchor="middle" class="box-sub">OLAP in-process · Parquet</text>

  <path d="M 890 235 L 960 235" class="arrow" marker-end="url(#arrow)"/>

  <!-- ============== Column 5 : DBT (3 layers stack) ============== -->
  <text x="1040" y="110" text-anchor="middle" class="col-title">dbt models</text>
  <rect x="960" y="125" width="160" height="50" rx="6" fill="#FFE4D6" stroke="#FB923C" stroke-width="1"/>
  <text x="1040" y="143" text-anchor="middle" class="box-title" fill="#C2410C">staging</text>
  <text x="1040" y="161" text-anchor="middle" class="box-sub">3 modèles · cast / rename</text>

  <rect x="960" y="190" width="160" height="50" rx="6" fill="#FFE4D6" stroke="#FB923C" stroke-width="1"/>
  <text x="1040" y="208" text-anchor="middle" class="box-title" fill="#C2410C">intermediate</text>
  <text x="1040" y="226" text-anchor="middle" class="box-sub">1 modèle · jointure météo</text>

  <rect x="960" y="255" width="160" height="50" rx="6" fill="#FFE4D6" stroke="#FB923C" stroke-width="1"/>
  <text x="1040" y="273" text-anchor="middle" class="box-title" fill="#C2410C">marts</text>
  <text x="1040" y="291" text-anchor="middle" class="box-sub">3 modèles · fct + agg</text>

  <!-- arrows from marts to ML -->
  <path d="M 1040 310 L 1040 360 L 580 360 L 580 400" class="arrow-main" marker-end="url(#arrowDark)"/>

  <!-- ============== Row : ML ============== -->
  <text x="600" y="395" text-anchor="middle" class="col-title">Machine Learning · scikit-learn</text>

  <rect x="320" y="405" width="220" height="60" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1"/>
  <text x="430" y="428" text-anchor="middle" class="box-title" fill="#166534">DBSCAN haversine</text>
  <text x="430" y="447" text-anchor="middle" class="box-sub">1 056 hotspots · ε=300m</text>

  <rect x="600" y="405" width="220" height="60" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1"/>
  <text x="710" y="428" text-anchor="middle" class="box-title" fill="#166534">RandomForest classifier</text>
  <text x="710" y="447" text-anchor="middle" class="box-sub">gravité fatale · ROC-AUC 0.72</text>

  <!-- arrows ML → outputs -->
  <path d="M 430 465 L 430 510 L 380 510 L 380 540" class="arrow" marker-end="url(#arrow)"/>
  <path d="M 710 465 L 710 510 L 760 510 L 760 540" class="arrow" marker-end="url(#arrow)"/>

  <!-- ============== Row : OUTPUTS ============== -->
  <text x="600" y="535" text-anchor="middle" class="col-title">Exposition</text>

  <rect x="280" y="545" width="200" height="60" rx="8" fill="#CCFBF1" stroke="#14B8A6" stroke-width="1"/>
  <text x="380" y="568" text-anchor="middle" class="box-title" fill="#115E59">FastAPI + Pydantic v2</text>
  <text x="380" y="587" text-anchor="middle" class="box-sub">4 endpoints · Swagger</text>

  <rect x="660" y="545" width="200" height="60" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1"/>
  <text x="760" y="568" text-anchor="middle" class="box-title" fill="#991B1B">Streamlit + Folium + Plotly</text>
  <text x="760" y="587" text-anchor="middle" class="box-sub">5 pages interactives</text>

  <!-- ============== Bottom banner : ORCHESTRATION + DEVOPS ============== -->
  <rect x="40" y="640" width="1120" height="60" rx="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="100" y="675" text-anchor="middle" class="box-title" fill="#1F2937">Apache Airflow</text>
  <text x="100" y="690" text-anchor="middle" class="box-sub">orchestration DAG</text>

  <line x1="200" y1="650" x2="200" y2="690" stroke="#D1D5DB" stroke-width="1"/>

  <text x="300" y="675" text-anchor="middle" class="box-title" fill="#1F2937">Docker Compose</text>
  <text x="300" y="690" text-anchor="middle" class="box-sub">conteneurisation</text>

  <line x1="400" y1="650" x2="400" y2="690" stroke="#D1D5DB" stroke-width="1"/>

  <text x="500" y="675" text-anchor="middle" class="box-title" fill="#1F2937">GitHub Actions</text>
  <text x="500" y="690" text-anchor="middle" class="box-sub">CI lint + tests</text>

  <line x1="600" y1="650" x2="600" y2="690" stroke="#D1D5DB" stroke-width="1"/>

  <text x="720" y="675" text-anchor="middle" class="box-title" fill="#1F2937">Great Expectations</text>
  <text x="720" y="690" text-anchor="middle" class="box-sub">validation données</text>

  <line x1="840" y1="650" x2="840" y2="690" stroke="#D1D5DB" stroke-width="1"/>

  <text x="940" y="675" text-anchor="middle" class="box-title" fill="#1F2937">pytest + dbt tests</text>
  <text x="940" y="690" text-anchor="middle" class="box-sub">13 tests dbt</text>

  <line x1="1040" y1="650" x2="1040" y2="690" stroke="#D1D5DB" stroke-width="1"/>

  <text x="1100" y="675" text-anchor="middle" class="box-title" fill="#1F2937">pre-commit</text>
  <text x="1100" y="690" text-anchor="middle" class="box-sub">ruff · black · mypy</text>
</svg>
