[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accidents-france-pipeline"
version = "0.1.0"
description = "Pipeline data end-to-end pour l'analyse des accidents de la route en France"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Data Analyst Portfolio" }]
keywords = ["data", "etl", "geospatial", "accidents", "france", "duckdb", "airflow"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ===== Black =====
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

# ===== Ruff =====
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "dbt_project/target"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

# ===== Mypy =====
[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["notebooks/", "dbt_project/"]

# ===== Pytest =====
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: tests unitaires rapides",
    "integration: tests d'intégration (DuckDB, API)",
    "slow: tests lents",
]

# ===== Coverage =====
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
